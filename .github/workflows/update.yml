name: Update

on:
  schedule:
    - cron: '0 12 * * *'

jobs:
  update-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: prepare git
        run: |
          git config --global user.email 'rpm-bot@coder966.net'
          git config --global user.name 'RPM Bot'

      - name: intellij-idea-ultimate
        run: |
          ./update.sh intellij-idea-ultimate https://data.services.jetbrains.com/products/releases?code=IIU&latest=true&type=release
